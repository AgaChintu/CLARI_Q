<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resolved Doubts | ClariQ</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Shared CSS -->
    <link rel="stylesheet" href="../teacher-css/common.css">

    <!-- Page CSS -->
    <link rel="stylesheet" href="../teacher-css/resolved-doubts.css">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest" defer></script>

    <!-- Shared Components -->
    <script src="../teacher-js/components.js" defer></script>

</head>

<body>

    <!-- SHARED SIDEBAR -->
    <div id="sidebar-container"></div>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <!-- SHARED TOPBAR -->
        <div id="topbar-container"></div>

        <section class="inbox-page resolved-page">

            <!-- PAGE HEADER -->
            <div class="page-header">

                <div>
                    <h1>Resolved Doubts</h1>

                    <p>
                        Browse all academic doubts you've answered throughout your teaching history.
                    </p>
                </div>

            </div>


            <!-- TOOLBAR -->
            <div class="inbox-toolbar">

                <!-- SEARCH -->
                <div class="search-wrapper">

                    <i data-lucide="search"></i>

                    <input
                        type="text"
                        id="resolvedSearch"
                        placeholder="Search resolved doubts, subjects or topics..."
                        autocomplete="off"
                    >

                    <button
                        class="clear-search"
                        id="clearResolvedSearch"
                        type="button"
                        aria-label="Clear search"
                    >
                        <i data-lucide="x"></i>
                    </button>

                </div>


                <!-- FILTER ROW -->
                <div class="filter-row">

                    <!-- BATCH FILTER -->
                    <div class="filter-wrapper">

                        <i data-lucide="users"></i>

                        <select id="batchFilter">
                            <option value="all">All Batches</option>
                            <option value="2025">Batch 2025</option>
                            <option value="2024">Batch 2024</option>
                            <option value="2023">Batch 2023</option>
                        </select>

                        <i data-lucide="chevron-down" class="select-chevron"></i>

                    </div>


                    <!-- YEAR FILTER -->
                    <div class="filter-wrapper">

                        <i data-lucide="calendar-days"></i>

                        <select id="yearFilter">
                            <option value="all">All Years</option>
                            <option value="1st Year">1st Year</option>
                            <option value="2nd Year">2nd Year</option>
                            <option value="3rd Year">3rd Year</option>
                            <option value="4th Year">4th Year</option>
                        </select>

                        <i data-lucide="chevron-down" class="select-chevron"></i>

                    </div>


                    <!-- SEMESTER FILTER -->
                    <div class="filter-wrapper">

                        <i data-lucide="bookmark"></i>

                        <select id="semesterFilter">
                            <option value="all">All Semesters</option>
                            <option value="1">Semester 1</option>
                            <option value="2">Semester 2</option>
                            <option value="3">Semester 3</option>
                            <option value="4">Semester 4</option>
                            <option value="5">Semester 5</option>
                            <option value="6">Semester 6</option>
                            <option value="7">Semester 7</option>
                            <option value="8">Semester 8</option>
                        </select>

                       <i data-lucide="chevron-down" class="select-chevron"></i>

                    </div>


                    <!-- CLASS FILTER -->
                    <div class="filter-wrapper">

                        <i data-lucide="graduation-cap"></i>

                        <select id="classFilter">
                            <option value="all">All Classes</option>
                            <option value="CS1">CS1</option>
                            <option value="CS2">CS2</option>
                            <option value="AIML">AIML</option>
                            <option value="DS">DS</option>
                            <option value="IT">IT</option>
                        </select>

                        <i data-lucide="chevron-down" class="select-chevron"></i>

                    </div>


                    <!-- SUBJECT FILTER -->
                    <div class="filter-wrapper">

                        <i data-lucide="book-open"></i>

                        <select id="subjectFilter">
                            <option value="all">All Subjects</option>
                            <option value="PPS">PPS</option>
                            <option value="DSA">DSA</option>
                            <option value="COA">COA</option>
                            <option value="DSTL">DSTL</option>
                            <option value="DE">DE</option>
                            <option value="Python">Python</option>
                            <option value="TC">TC</option>
                        </select>

                        <i data-lucide="chevron-down" class="select-chevron"></i>

                    </div>

                </div>

            </div>


            <!-- RESOLVED DOUBTS LIST -->
            <div class="doubts-list" id="resolvedDoubtsList">

                <!-- Cards generated through JavaScript -->

            </div>


            <!-- EMPTY STATE -->
            <div class="empty-state hidden" id="emptyState">

                <div class="empty-icon">
                    <i data-lucide="inbox"></i>
                </div>

                <h3 id="emptyTitle">No resolved doubts found</h3>

                <p id="emptyDescription">
                    There are no resolved doubts matching your current filters.
                </p>

            </div>

        </section>

    </main>


    <!-- PAGE JS -->
    <script src="../teacher-js/resolved-doubts.js"></script>

</body>

</html>
