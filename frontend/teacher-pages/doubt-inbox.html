<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doubts Inbox | ClariQ</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Shared CSS -->
    <link rel="stylesheet" href="../teacher-css/common.css">

    <!-- Page CSS -->
    <link rel="stylesheet" href="../teacher-css/doubt-inbox.css">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest" defer></script>

    <!-- Shared Components -->
    <script src="../teacher-js/components.js" defer></script>

</head>

<body>

    <!-- SHARED SIDEBAR -->
    <div id="sidebar-container"></div>


    <!-- MAIN CONTENT -->
    <main class="main-content">

        <!-- SHARED TOPBAR -->
        <div id="topbar-container"></div>


        <section class="inbox-page">

            <!-- PAGE HEADER -->
            <div class="page-header">

                <div>
                    <h1>Doubts Inbox</h1>

                    <p>
                        Review and manage student doubts across all assigned classes.
                    </p>
                </div>

            </div>


            <!-- TOOLBAR -->
            <div class="inbox-toolbar">

                <!-- SEARCH -->
                <div class="search-wrapper">

                    <i data-lucide="search"></i>

                    <input
                        type="text"
                        id="doubtSearch"
                        placeholder="Search doubts, subjects or topics..."
                        autocomplete="off"
                    >

                    <button
                        class="clear-search"
                        id="clearSearch"
                        type="button"
                        aria-label="Clear search"
                    >
                        <i data-lucide="x"></i>
                    </button>

                </div>


                <!-- CLASS FILTER -->
                <div class="class-filter-wrapper">

                    <i data-lucide="graduation-cap"></i>

                    <select id="classFilter">

                        <option value="all">All Classes</option>

                        <option value="1st Year AIML">
                            1st Year AIML
                        </option>

                        <option value="2nd Year CS">
                            2nd Year CS
                        </option>

                        <option value="2nd Year AIML">
                            2nd Year AIML
                        </option>

                    </select>

                    <i data-lucide="chevron-down" class="select-chevron"></i>

                </div>

            </div>


            <!-- TABS -->
            <div class="inbox-tabs">

                <button
                    class="inbox-tab active"
                    data-tab="new"
                    type="button"
                >

                    New Doubts

                    <span class="tab-count" id="newCount">0</span>

                </button>


                <button
                    class="inbox-tab"
                    data-tab="progress"
                    type="button"
                >

                    In Progress

                    <span class="tab-count" id="progressCount">0</span>

                </button>

            </div>


            <!-- DOUBTS LIST -->
            <div class="doubts-list" id="doubtsList">

                <!-- Cards generated through JavaScript -->

            </div>


            <!-- EMPTY STATE -->
            <div class="empty-state hidden" id="emptyState">

                <div class="empty-icon">
                    <i data-lucide="inbox"></i>
                </div>

                <h3 id="emptyTitle">No doubts found</h3>

                <p id="emptyDescription">
                    There are no doubts matching your current filters.
                </p>

            </div>


        </section>

    </main>


    <!-- COMPONENTS -->
    <script src="../teacher-js/components.js"></script>

    <!-- PAGE JS -->
    <script src="../teacher-js/doubt-inbox.js"></script>


</body>

</html>
