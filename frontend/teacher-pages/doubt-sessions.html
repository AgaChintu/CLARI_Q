<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doubt Sessions | ClariQ</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Shared CSS -->
    <link rel="stylesheet" href="../teacher-css/common.css">

    <!-- Page CSS -->
    <link rel="stylesheet" href="../teacher-css/doubt-sessions.css">

    <!-- Lucide -->
    <script src="https://unpkg.com/lucide@latest" defer></script>

    <!-- Shared Components -->
    <script src="../teacher-js/components.js" defer></script>

    <!-- Page JS -->
    <script src="../teacher-js/doubt-sessions.js" defer></script>

</head>

<body>

    <!-- SHARED SIDEBAR -->
    <div id="sidebar-container"></div>


    <!-- MAIN CONTENT -->
    <main class="main-content">

        <!-- SHARED TOPBAR -->
        <div id="topbar-container"></div>


        <section class="sessions-page">


            <!-- =====================================
                 PAGE HEADER
            ====================================== -->

            <div class="page-header">

                <div class="page-heading">

                    <h1>Doubt Sessions</h1>

                    <p>
                        Manage your academic doubt-solving sessions.
                    </p>

                </div>


                <button
                    class="primary-btn"
                    id="create-session-btn"
                    type="button">

                    <i data-lucide="plus"></i>

                    Schedule a Session

                </button>

            </div>



            <!-- =====================================
                 ACTIVE SESSIONS
            ====================================== -->

            <section class="active-section">

                <div class="section-heading">

                    <div class="section-label">

                        <span class="blue-dot"></span>

                        <h2 id="active-session-heading">
                            ACTIVE SESSIONS (00)
                        </h2>

                    </div>

                </div>


                <div class="active-carousel">

                    <div
                        class="active-carousel-track"
                        id="active-session-track"
                        style="display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth;">

                    </div>


                    <div
                        class="carousel-indicators"
                        id="carousel-indicators">

                    </div>

                </div>

            </section>



            <!-- =====================================
                 UPCOMING SESSIONS
            ====================================== -->

            <section class="content-section upcoming-section">

                <div class="section-heading">

                    <div class="section-label">

                        <i data-lucide="calendar-days"></i>

                        <h2 id="upcoming-session-heading">
                            UPCOMING SESSIONS (00)
                        </h2>

                    </div>

                </div>


                <!-- Upcoming cards are rendered dynamically by JS -->
                <div
                    class="upcoming-grid"
                    id="upcoming-list">

                </div>

            </section>



            <!-- =====================================
                 PAST SESSIONS
            ====================================== -->

            <section class="content-section past-section">

                <div class="section-heading">

                    <div class="section-label">

                        <i data-lucide="clock"></i>

                        <h2>PAST SESSIONS</h2>

                    </div>


                    <button
                        class="view-all-btn"
                        type="button">

                        View All

                        <i data-lucide="arrow-right"></i>

                    </button>

                </div>


                <div class="past-grid" id="past-list">


                    <!-- PAST SESSION 1 -->
                    <article class="past-session-card">

                        <div class="past-session-content">

                            <div class="session-card-top">

                                <span class="subject-pill">
                                    PPS
                                </span>

                                <span class="class-text">
                                    1st Year · AIML
                                </span>

                            </div>


                            <h3>
                                Programming Fundamentals
                            </h3>


                            <div class="past-session-footer">

                                <div class="detail-row">

                                    <i data-lucide="calendar-days"></i>

                                    <span>
                                        15 Nov 2026
                                    </span>

                                </div>


                                <span class="completed-badge">
                                    Completed
                                </span>

                            </div>

                        </div>

                    </article>



                    <!-- PAST SESSION 2 -->
                    <article class="past-session-card">

                        <div class="past-session-content">

                            <div class="session-card-top">

                                <span class="subject-pill">
                                    Python
                                </span>

                                <span class="class-text">
                                    2nd Year · CS
                                </span>

                            </div>


                            <h3>
                                Python Functions and Modules
                            </h3>


                            <div class="past-session-footer">

                                <div class="detail-row">

                                    <i data-lucide="calendar-days"></i>

                                    <span>
                                        10 Nov 2026
                                    </span>

                                </div>


                                <span class="completed-badge">
                                    Completed
                                </span>

                            </div>

                        </div>

                    </article>


                </div>

            </section>


        </section>

    </main>

</body>

</html>
