<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ClariQ | Library</title>

    <link rel="stylesheet" href="../student-css/common.css">
    <link rel="stylesheet" href="../student-css/library.css">

    <script src="../student-js/common.js" defer></script>
    <script src="../student-js/library.js" defer></script>

    <script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>

    <!-- ==========================================
         SIDEBAR
    ========================================== -->

    <nav class="sidebar">

        <img src="../assets/images/clariq-logo.svg" alt="ClariQ Logo" class="logo">

        <ul>

            <li>
                <a href="dashboard.html">
                    <i data-lucide="house"></i>
                    <span>Home</span>
                </a>
            </li>

            <li>
                <a href="ask-doubt.html">
                    <i data-lucide="circle-help"></i>
                    <span>Ask Doubt</span>
                </a>
            </li>

            <li>
                <a href="my-doubts.html">
                    <i data-lucide="message-circle"></i>
                    <span>My Doubts</span>
                </a>
            </li>

            <li>
                <a href="library.html" class="nav-item-active">
                    <i data-lucide="book-open"></i>
                    <span>Library</span>
                </a>
            </li>

            <li>
                <a href="doubt-sessions.html">
                    <i data-lucide="messages-square"></i>
                    <span>Doubt Sessions</span>
                </a>
            </li>


            <li>
                <a href="saves.html">
                    <i data-lucide="bookmark"></i>
                    <span>Saves</span>
                </a>
            </li>

        </ul>


        <!-- ANONYMOUS BOX -->

        <div class="anonymous-box">

            <img src="../assets/icons/anonymous-icon.svg" alt="Anonymous Icon" class="anonymous-icon">

            <div class="anonymous-text">

                <h3>Ask Freely, Stay Anonymous</h3>

                <p>
                    Your identity stays protected when you ask a doubt.
                </p>

            </div>

        </div>

    </nav>


    <!-- ==========================================
         TOP RIGHT
    ========================================== -->

    <div class="top-right">

        <button class="notification-btn">

            <i data-lucide="bell"></i>

        </button>


        <button class="profile-btn">

            <span class="avatar">A</span>

            <span>Anushka</span>

            <i data-lucide="chevron-down"></i>

        </button>

    </div>


    <!-- ==========================================
         MAIN CONTENT
    ========================================== -->

    <main>


        <!-- PAGE HEADING -->

        <div class="page-title">

            <h1>Library</h1>

            <h2>
                Explore resolved doubts and resources shared by teachers.
            </h2>

        </div>


        <!-- ======================================
             SEARCH AND FILTER
        ====================================== -->

        <div class="search-card">


            <!-- SEARCH -->

            <div class="search-box">

                <i data-lucide="search"></i>

                <input type="text" placeholder="Search library..." id="searchInput">

            </div>


            <!-- SUBJECT FILTER -->

            <div class="select-wrapper">

                <select class="select-subj" id="subjectSelect">

                    <option value="all">All Subjects</option>

                    <option value="DSA">DSA</option>

                    <option value="COA">COA</option>

                    <option value="DSTL">DSTL</option>

                    <option value="DE">DE</option>

                    <option value="Python">Python</option>

                    <option value="TC">TC</option>

                </select>

                <i data-lucide="chevron-down"></i>

            </div>


            <!-- ASK DOUBT BUTTON -->

            <button class="ask-doubt-btn" onclick="window.location.href='ask-doubt.html'">

                <i data-lucide="plus"></i>

                Ask a Doubt

            </button>


        </div>

        <!-- ======================================
            LIBRARY DOUBT CARDS
        ====================================== -->

        <div id="libraryList" class="library-list"></div>


        <!-- NO RESULTS -->

        <p id="noResults" class="no-results" hidden>
            No doubts found. Try another search.
        </p>


    </main>


    <script>
        lucide.createIcons();
    </script>

</body>

</html>
