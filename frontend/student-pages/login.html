<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClariQ Login</title>
    <link rel="stylesheet" href="../student-css/login.css">
</head>

<body>

    <div class="container">

        <!-- LEFT SIDE: Text and Illustration -->
        <div class="left">
            <div class="left-content">
                <h1 class="hero-title">
                    Ask. Learn.<br />
                    <span class="highlight">Grow.</span>
                </h1>
                <p class="hero-subtitle">
                    AI-powered, identity-protected<br />
                    doubt resolution for a smarter<br />
                    academic journey.
                </p>

                <!-- Illustration Image Container -->
                <div class="illustration-container">
                    <img src="../assets/images/login-logo.png.svg" alt="Illustration" class="hero-img" />

                    <div class="features-row">
                        <!-- Feature 1 -->
                        <div class="feature-item">
                            <div class="feature-icon-circle">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                                </svg>
                            </div>
                            <span class="feature-text">Your doubts,<br>your privacy</span>
                        </div>

                        <div class="feature-divider"></div>

                        <!-- Feature 2 -->
                        <div class="feature-item">
                            <div class="feature-icon-circle">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                </svg>
                            </div>
                            <span class="feature-text">Teacher verified<br>answers</span>
                        </div>

                        <div class="feature-divider"></div>

                        <!-- Feature 3 -->
                        <div class="feature-item">
                            <div class="feature-icon-circle">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                                </svg>
                            </div>
                            <span class="feature-text">Better learning,<br>together</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- RIGHT SIDE: Login Box -->
        <div class="right">
            <div class="login-box">
                <!-- Header Section (Centered) -->
                <div class="card-header">
                    <img src="../assets/images/clariq-logo.svg" alt="ClariQ Logo" class="logo" />
                    <h2>Welcome Back</h2>
                    <p class="login-subtitle">Log in with your Student ID to continue</p>
                </div>

                <!-- Login Form Section -->
                <form class="login-form">
                    <!-- Student ID Input -->
                    <div class="form-group">
                        <label for="studentId">
                            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                            Student ID
                        </label>
                        <input type="text" id="studentId" placeholder="Enter your Student ID" />
                    </div>

                    <!-- Password Input with Eye Icon inside -->
                    <div class="form-group">
                        <label for="password">
                            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                            Password
                        </label>
                        <div class="password-wrapper">
                            <input type="password" id="password" placeholder="Enter your password" />
                            <button type="button" class="eye-btn" id="togglePassword"
                                aria-label="Toggle password visibility">
                                <!-- Eye SVG Icon -->
                                <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="loginBtn">
                        Login <span>&rarr;</span>
                    </button>
                </form>

                <!-- Bottom Divider -->
                <div class="divider">
                    <span>ClariQ</span>
                </div>

                <!-- Security Badges Footer (Centered) -->
                <div class="footer-badges">
                    <span class="badge-item">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                        </svg>
                        Secure
                    </span>
                    <span class="dot">&bull;</span>
                    <span class="badge-item">Private</span>
                    <span class="dot">&bull;</span>
                    <span class="badge-item">For Students</span>
                </div>

            </div>
        </div>

    </div>

    <script src="../student-js/login.js"></script>
</body>

</html>
