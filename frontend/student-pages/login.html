<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClariQ Login</title>
    <link rel="stylesheet" href="../student-css/login.css">
    <link rel="stylesheet" href="../student-css/common.css">
</head>

<body>

    <div class="container">

        <!-- LEFT SIDE: Text and Illustration -->
        <div class="left">
            <div class="left-content">

                <h1 class="hero-title">
                    Ask. Learn.<br />
                    <span class="highlight">Grow.</span>
                </h1>

                <p class="hero-subtitle">
                    AI-powered, identity-protected<br />
                    doubt resolution for a smarter<br />
                    academic journey.
                </p>

                <!-- Illustration -->
                <div class="illustration-container">

                    <img src="../assets/images/login-illustration.png"
                         alt="Illustration"
                         class="hero-img" />

                    <div class="features-row">

                        <!-- Feature 1 -->
                        <div class="feature-item">
                            <div class="feature-icon-circle">
                                <i data-lucide="shield-check"></i>
                            </div>
                            <span class="feature-text">
                                Your doubts,<br>your privacy
                            </span>
                        </div>

                        <div class="feature-divider"></div>

                        <!-- Feature 2 -->
                        <div class="feature-item">
                            <div class="feature-icon-circle">
                                <i data-lucide="user-round"></i>
                            </div>
                            <span class="feature-text">
                                Teacher verified<br>answers
                            </span>
                        </div>

                        <div class="feature-divider"></div>

                        <!-- Feature 3 -->
                        <div class="feature-item">
                            <div class="feature-icon-circle">
                                <i data-lucide="book-open"></i>
                            </div>
                            <span class="feature-text">
                                Better learning,<br>together
                            </span>
                        </div>

                    </div>
                </div>
            </div>
        </div>


        <!-- RIGHT SIDE: Login Box -->
        <div class="right">

            <div class="login-box">

                <!-- Header -->
                <div class="card-header">

                    <img src="../assets/images/clariq-logo.svg"
                         alt="ClariQ Logo"
                         class="logo" />

                    <h2>Welcome Back</h2>

                    <p class="login-subtitle">
                        Log in with your Student ID to continue
                    </p>

                </div>


                <!-- Login Form -->
                <form class="login-form">

                    <!-- Student ID -->
                    <div class="form-group">

                        <label for="studentId">
                            <i data-lucide="user-round" class="input-icon"></i>
                            Student ID
                        </label>

                        <input type="text"
                               id="studentId"
                               placeholder="Enter your Student ID" />

                    </div>


                    <!-- Password -->
                    <div class="form-group">

                        <label for="password">
                            <i data-lucide="lock-keyhole" class="input-icon"></i>
                            Password
                        </label>

                        <div class="password-wrapper">

                            <input type="password"
                                   id="password"
                                   placeholder="Enter your password" />

                            <button type="button"
                                    class="eye-btn"
                                    id="togglePassword"
                                    aria-label="Toggle password visibility">

                                <i data-lucide="eye" id="eyeIcon"></i>

                            </button>

                        </div>

                    </div>


                    <!-- Submit Button -->
                    <button type="submit" id="loginBtn">
                        Login <span>&rarr;</span>
                    </button>

                </form>


                <!-- Divider -->
                <div class="divider">
                    <span>ClariQ</span>
                </div>


                <!-- Security Badges -->
                <div class="footer-badges">

                    <span class="badge-item">
                        <i data-lucide="shield-check"></i>
                        Secure
                    </span>

                    <span class="dot">&bull;</span>

                    <span class="badge-item">
                        Private
                    </span>

                    <span class="dot">&bull;</span>

                    <span class="badge-item">
                        For Students
                    </span>

                </div>

            </div>
        </div>

    </div>


    <!-- Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Login JS -->
    

    <script>
        lucide.createIcons();
    </script>

</body>
</html>
