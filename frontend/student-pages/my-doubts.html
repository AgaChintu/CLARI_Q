<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>My doubts</title>
    <link rel="stylesheet" href="../student-css/common.css">
    <link rel="stylesheet" href="../student-css/my-doubts.css">
    <script src="../student-js/common.js" defer></script>
    <script src="../student-js/my-doubts.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>



</head>

<body>


    <nav class="sidebar">
        <img src="../assets/images/clariq-logo.svg" alt="ClariQ Logo" class="logo">
        <ul>
            <li>
                <a href="dashboard.html">
                    <i data-lucide="house"></i>
                    <span>Home</span>
                </a>
            </li>
            <li>
                <a href="ask-doubt.html">
                    <i data-lucide="circle-help"></i>
                    <span>Ask Doubt</span>
                </a>
            </li>
            <li>
                <a href="my-doubts.html" class="nav-item-active">
                    <i data-lucide="message-circle"></i>
                    <span>My Doubts</span>
                </a>
            </li>
            <li>
                <a href="library.html">
                    <i data-lucide="book-open"></i>
                    <span>Library</span>
                </a>
            </li>
            <li>
                <a href="doubt-sessions.html">
                    <i data-lucide="messages-square"></i>
                    <span>Doubt Sessions</span>
                </a>
            </li>
            <li>
                <a href="exam-support.html">
                    <i data-lucide="calendar"></i>
                    <span>Exam Support</span>
                </a>
            </li>
            <li>
                <a href="saves.html">
                    <i data-lucide="bookmark"></i>
                    <span>Saves</span>
                </a>

            </li>
        </ul>


        <div class="anonymous-box">

            <img src="../assets/icons/anonymous-icon.svg" alt="Anonymous Icon" class="anonymous-icon">

            <div class="anonymous-text">
                <h3>Ask Freely, Stay Anonymous</h3>
                <p>Your identity stays protected when you ask a doubt.</p>
            </div>

        </div>





    </nav>

    <div class="top-right">

        <button class="notification-btn">
            <i data-lucide="bell"></i>
        </button>

        <button class="profile-btn">
            <span class="avatar">A</span>
            <span>Anushka</span>
            <i data-lucide="chevron-down"></i>


        </button>

    </div>










    <main>
        <div class="page-title">
            <h1>My Doubts</h1>
            <h2>Track your submitted doubts and their status.</h2>

        </div>

        <div class="search-card">
            <div class="search-box">
                <i data-lucide="search"></i>
                <input type="text" placeholder="Search my doubts..." id="searchInput">
            </div>

            <div class="select-wrapper">
                <select class="select-subj" id="subjectSelect">
                    <option value="all">All Subjects</option>
                    <option value="DSA">DSA</option>
                    <option value="COA">COA</option>
                    <option value="DSTL">DSTL</option>
                    <option value="Python">Python</option>
                    <option value="DE">DE</option>
                    <option value="TC">TC</option>
                </select>

                <i data-lucide="chevron-down"></i>
            </div>

            <button class="ask-doubt-btn">
                <i data-lucide="plus"></i>
                Ask a Doubt
            </button>
        </div>

        <div class="doubt-controls">

            <div class="status-tabs">
                <button class="status-tab-active" data-status="all">
                    All
                </button>

                <button class="status-tab" data-status="pending">
                    Pending
                </button>

                <button class="status-tab" data-status="in-progress">
                    In Progress
                </button>

                <button class="status-tab" data-status="resolved">
                    Resolved
                </button>

                <button class="status-tab" data-status="shared">
                    Shared
                </button>


            </div>

            <div class="sort-controls">
                <i data-lucide="arrow-down-up" class="sort-icon"></i>
                <select id="sort-doubts">
                    <option value="latest" selected>Latest</option>
                    <option value="oldest">Oldest</option>
                </select>
                <i data-lucide="chevron-down" class="chevron-icon"></i>
            </div>


        </div>


        <div id="doubtContainer"></div>



    </main>





    <script>
        lucide.createIcons();
    </script>

</body>

</html>
